name: Publish SDK

# CI/CD runs locally by policy (2026-07). Manual-only until further notice.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-sdk:
    name: Publish @sigmon/sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @sigmon/sdk build

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@latest
          version="$(npm --version)"
          echo "npm $version"
          floor="11.5.1"
          if [ "$(printf '%s\n' "$floor" "$version" | sort -V | head -n1)" != "$floor" ]; then
            echo "npm $version does not support Trusted Publishing (OIDC); need >= $floor" >&2
            exit 1
          fi

      - name: Publish SDK to npm
        working-directory: packages/sdk
        run: npm publish --access public
