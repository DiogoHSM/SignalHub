name: Publish SDK

# CI/CD runs locally by policy (2026-07). Manual-only until further notice.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-sdk:
    name: Publish @sigmon/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @sigmon/sdk build

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@11.19.1
          version="$(npm --version)"
          echo "npm $version"
          floor="11.5.1"
          if [ "$(printf '%s\n' "$floor" "$version" | sort -V | head -n1)" != "$floor" ]; then
            echo "npm $version does not support Trusted Publishing (OIDC); need >= $floor" >&2
            exit 1
          fi

      - name: Publish SDK to npm
        working-directory: packages/sdk
        run: npm publish --access public
