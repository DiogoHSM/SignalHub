name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  smoke-compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Compose smoke harness
        run: pnpm smoke:compose --project-name sigmon_ci_smoke --preserve

      - name: Collect smoke diagnostics
        if: failure()
        run: |
          docker compose -p sigmon_ci_smoke ps -a || true
          docker compose -p sigmon_ci_smoke logs --no-color || true
          docker system df || true

      - name: Cleanup smoke resources
        if: always()
        run: docker compose -p sigmon_ci_smoke down -v || true

  deploy-easypanel:
    name: Deploy EasyPanel
    runs-on: ubuntu-latest
    needs: [test, build, compose-config, smoke-compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      EASYPANEL_API_DEPLOY_URL: ${{ secrets.EASYPANEL_API_DEPLOY_URL || secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_WORKER_DEPLOY_URL: ${{ secrets.EASYPANEL_WORKER_DEPLOY_URL }}
      EASYPANEL_SCHEDULER_DEPLOY_URL: ${{ secrets.EASYPANEL_SCHEDULER_DEPLOY_URL }}
    steps:
      - name: Trigger EasyPanel deploy hooks
        run: |
          set -euo pipefail

          if [ -n "${EASYPANEL_API_DEPLOY_URL}" ]; then
            curl --fail --silent --show-error --request POST "${EASYPANEL_API_DEPLOY_URL}"
          else
            echo "::notice::No EasyPanel API deploy URL configured; skipping API deploy."
          fi

          if [ -n "${EASYPANEL_WORKER_DEPLOY_URL}" ]; then
            curl --fail --silent --show-error --request POST "${EASYPANEL_WORKER_DEPLOY_URL}"
          else
            echo "::notice::No EasyPanel worker deploy URL configured; skipping worker deploy."
          fi

          if [ -n "${EASYPANEL_SCHEDULER_DEPLOY_URL}" ]; then
            curl --fail --silent --show-error --request POST "${EASYPANEL_SCHEDULER_DEPLOY_URL}"
          else
            echo "::notice::No EasyPanel scheduler deploy URL configured; skipping scheduler deploy."
          fi
