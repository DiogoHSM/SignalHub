name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  smoke-compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Compose smoke harness
        run: pnpm smoke:compose --project-name sigmon_ci_smoke --preserve

      - name: Collect smoke diagnostics
        if: failure()
        run: |
          docker compose -p sigmon_ci_smoke ps -a || true
          docker compose -p sigmon_ci_smoke logs --no-color || true
          docker system df || true

      - name: Cleanup smoke resources
        if: always()
        run: docker compose -p sigmon_ci_smoke down -v || true

  deploy-easypanel:
    name: Deploy EasyPanel
    runs-on: ubuntu-latest
    needs: [test, build, compose-config, smoke-compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      EASYPANEL_API_DEPLOY_URL: ${{ secrets.EASYPANEL_API_DEPLOY_URL || secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_WORKER_DEPLOY_URL: ${{ secrets.EASYPANEL_WORKER_DEPLOY_URL }}
      EASYPANEL_SCHEDULER_DEPLOY_URL: ${{ secrets.EASYPANEL_SCHEDULER_DEPLOY_URL }}
    steps:
      - name: Trigger EasyPanel deploy hooks
        run: |
          set -euo pipefail

          trigger_deploy() {
            local service_name="$1"
            local deploy_url="$2"
            local response
            local status

            if [ -z "${deploy_url}" ]; then
              echo "::notice::No EasyPanel ${service_name} deploy URL configured; skipping ${service_name} deploy."
              return 0
            fi

            echo "::group::Trigger EasyPanel ${service_name} deploy"
            set +e
            response="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --request POST \
                --retry 2 \
                --retry-all-errors \
                --retry-delay 5 \
                "${deploy_url}" 2>&1
            )"
            status=$?
            set -e

            printf '%s\n' "${response}"

            if [ "${status}" -eq 0 ]; then
              echo "::notice::EasyPanel ${service_name} deploy hook accepted."
              echo "::endgroup::"
              return 0
            fi

            if [ "${status}" -eq 56 ] && printf '%s\n' "${response}" | grep -qi "Deploying"; then
              echo "::notice::EasyPanel ${service_name} deploy hook started but reset the connection after responding."
              echo "::endgroup::"
              return 0
            fi

            echo "::error::EasyPanel ${service_name} deploy hook failed with curl exit ${status}."
            echo "::endgroup::"
            return "${status}"
          }

          trigger_deploy "API" "${EASYPANEL_API_DEPLOY_URL}"
          trigger_deploy "worker" "${EASYPANEL_WORKER_DEPLOY_URL}"
          trigger_deploy "scheduler" "${EASYPANEL_SCHEDULER_DEPLOY_URL}"
