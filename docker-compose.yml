services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sigmon
      POSTGRES_USER: sigmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigmon-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmon -d sigmon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm start:api
    env_file:
      - path: ${SIGMON_ENV_FILE:-.env}
        required: false
    environment:
      CONSOLE_ENABLED: "true"
      DATABASE_URL: postgres://sigmon:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-sigmon-local-only-change-me}}@postgres:5432/sigmon
      REDIS_URL: redis://redis:6379
      SIGMON_PUBLIC_ENDPOINT: ${SIGMON_PUBLIC_ENDPOINT:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - source_map_data:/var/lib/sigmon/source-maps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm start:worker
    env_file:
      - path: ${SIGMON_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgres://sigmon:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-sigmon-local-only-change-me}}@postgres:5432/sigmon
      REDIS_URL: redis://redis:6379
    volumes:
      - backup_data:/var/lib/sigmon/backups
      - source_map_data:/var/lib/sigmon/source-maps
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -v grep | grep -q 'worker'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  backup_data:
  source_map_data:
