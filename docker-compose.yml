services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalhub
      POSTGRES_USER: signalhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalhub-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalhub -d signalhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm start:api
    env_file:
      - path: .env
        required: false
    environment:
      CONSOLE_ENABLED: "true"
      DATABASE_URL: postgres://signalhub:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-signalhub-local-only-change-me}}@postgres:5432/signalhub
      REDIS_URL: redis://redis:6379
      SIGNALHUB_PUBLIC_ENDPOINT: ${SIGNALHUB_PUBLIC_ENDPOINT:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm start:worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://signalhub:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-signalhub-local-only-change-me}}@postgres:5432/signalhub
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
